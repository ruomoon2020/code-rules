# 规则包一致性校验 — 业务仓复制为 .github/workflows/miniapp-rules-package-validate.yml

name: miniapp-rules-package-validate

on:
  pull_request:
    paths:
      - "rules/**"
      - ".github/workflows/miniapp-rules-package-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate embedded miniapp rules package
        run: python rules/scripts/validate-rules-package.py --rules-dir rules
