# 复制到业务仓 .github/workflows/credential-scan-required.yml，并设为 Required Check。

name: credential-scan-required

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.0"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "${archive}" "${release}/${archive}"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output checksums.txt "${release}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}$" checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Verify scanner behavior
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gitleaks version)"
          test "${actual#v}" = "${GITLEAKS_VERSION}"

          work="${RUNNER_TEMP}/scanner-canary"
          mkdir -p "${work}"
          printf 'ordinary configuration\n' > "${work}/clean.txt"
          marker="$(printf 'code-rules-scanner-canary' | sha256sum | cut -d ' ' -f 1)"
          printf 'api_key = "%s"\n' "${marker}" > "${work}/must-detect.txt"

          gitleaks dir --no-banner --redact "${work}/clean.txt"
          set +e
          gitleaks dir --no-banner --redact "${work}/must-detect.txt" >/dev/null 2>&1
          status=$?
          set -e
          if [ "${status}" -ne 1 ]; then
            echo "::error::Scanner canary was not detected (exit ${status})"
            exit 1
          fi

      - name: Scan repository history
        run: gitleaks git --redact --verbose .
