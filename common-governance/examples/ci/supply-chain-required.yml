# 供应链 Required 门禁 - 复制到业务仓 `.github/workflows/supply-chain-required.yml`
# 见 monorepo `docs/supply-chain-baseline.md`；金融 / 政务建议 Required，其余至少 Conditional。
# Java 依赖扫描：Maven 使用固定版本插件；Gradle 项目须应用对应 OWASP 插件。

name: supply-chain-required

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "package-lock.json"
      - "yarn.lock"
      - "pom.xml"
      - "build.gradle*"
      - "gradle.lockfile"
      - ".github/workflows/supply-chain-required.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-projects:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.detect.outputs.node }}
      maven: ${{ steps.detect.outputs.maven }}
      gradle: ${{ steps.detect.outputs.gradle }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Detect project types
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then echo "node=true" >> "${GITHUB_OUTPUT}"; else echo "node=false" >> "${GITHUB_OUTPUT}"; fi
          if [ -f pom.xml ]; then echo "maven=true" >> "${GITHUB_OUTPUT}"; else echo "maven=false" >> "${GITHUB_OUTPUT}"; fi
          if [ -f gradlew ] && { [ -f build.gradle ] || [ -f build.gradle.kts ]; } && [ ! -f pom.xml ]; then
            echo "gradle=true" >> "${GITHUB_OUTPUT}"
          else
            echo "gradle=false" >> "${GITHUB_OUTPUT}"
          fi

  node-dependency-policy:
    needs: detect-projects
    if: needs.detect-projects.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Node lockfile
        id: lockfile
        shell: bash
        run: |
          set -euo pipefail
          locks=()
          for candidate in pnpm-lock.yaml package-lock.json yarn.lock; do
            if [ -f "${candidate}" ]; then
              locks+=("${candidate}")
            fi
          done
          if [ "${#locks[@]}" -ne 1 ]; then
            echo "::error::Exactly one Node lockfile is required; found ${#locks[@]}"
            exit 1
          fi
          case "${locks[0]}" in
            pnpm-lock.yaml) echo "manager=pnpm" >> "${GITHUB_OUTPUT}" ;;
            package-lock.json) echo "manager=npm" >> "${GITHUB_OUTPUT}" ;;
            yarn.lock)
              echo "::error::This baseline does not silently approximate Yarn audits; add an organization-approved Yarn workflow"
              exit 1
              ;;
          esac

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.lockfile.outputs.manager == 'pnpm'
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.lockfile.outputs.manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Audit dependencies (high+)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.lockfile.outputs.manager }}" = "pnpm" ]; then
            pnpm audit --audit-level=high
          else
            npm audit --audit-level=high
          fi

      - name: Check production licenses
        run: |
          npx --yes license-checker@25.0.1 --production --summary \
            --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;Unlicense'

  maven-dependency-check:
    needs: detect-projects
    if: needs.detect-projects.outputs.maven == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: OWASP Dependency-Check
        run: mvn -B -DskipTests org.owasp:dependency-check-maven:12.2.2:check -DfailBuildOnCVSS=7

  gradle-dependency-check:
    needs: detect-projects
    if: needs.detect-projects.outputs.gradle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: OWASP Dependency-Check (Gradle)
        run: |
          chmod +x gradlew
          if ./gradlew tasks --all --no-daemon 2>/dev/null | grep -q dependencyCheckAnalyze; then
            ./gradlew dependencyCheckAnalyze --no-daemon
          else
            echo "::error::Apply org.owasp.dependencycheck plugin version 12.2.2. See web-backend/rules/examples/gradle/build.gradle.kts.sample"
            exit 1
          fi
