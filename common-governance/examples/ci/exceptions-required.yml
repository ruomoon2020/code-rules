# 复制到业务仓 .github/workflows/exceptions-required.yml，并设为 Required Check（有开放豁免时）。
# 豁免 YAML 放在业务仓 docs/exceptions/*.yaml（勿与 common-governance/docs/exceptions/README.md 混淆）。

name: exceptions-required

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-exceptions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate exception records
        run: python common-governance/scripts/validate-exceptions.py --root .
