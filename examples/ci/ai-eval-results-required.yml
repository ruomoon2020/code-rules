# 复制到业务仓 .github/workflows/ai-eval-results-required.yml。
# 本 workflow 只校验已提交的 AI Tool Safety 结果 YAML，不调用模型。
# 模型执行器须由业务仓自备并钉死版本；未跑评测不得手填 5/5。
#
# 建议：发版 tag / workflow_dispatch / 显式 Required（本变更使用 AI 时）。
# 环境变量：
#   AI_EVAL_RESULTS_FILE  — 默认 evidence/ai-eval-results.yaml
#   AI_EVAL_SUITE_FILE    — 默认 rules/evals/ai-tool-safety.md（按端调整路径）

name: ai-eval-results-required

on:
  workflow_dispatch:
  push:
    tags: ["v*", "release-*"]
  pull_request:
    paths:
      - "evidence/ai-eval-results.yaml"
      - "**/evals/ai-tool-safety.md"
      - ".github/workflows/ai-eval-results-required.yml"

permissions:
  contents: read

jobs:
  validate-ai-eval-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_EVAL_RESULTS_FILE: evidence/ai-eval-results.yaml
      AI_EVAL_SUITE_FILE: rules/evals/ai-tool-safety.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Require result artifact
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "${AI_EVAL_RESULTS_FILE}" ]]; then
            echo "MISSING ${AI_EVAL_RESULTS_FILE}"
            echo "Run the AI Tool Safety suite with a pinned model, write the YAML, then re-run."
            echo "This job does not execute models; see common-governance/docs/ai-tool-security.md"
            exit 1
          fi
          if [[ ! -f "${AI_EVAL_SUITE_FILE}" ]]; then
            echo "MISSING suite ${AI_EVAL_SUITE_FILE}"
            exit 1
          fi
      - name: Validate suite-bound results
        run: >
          python common-governance/scripts/validate-ai-eval-results.py
          --file "${AI_EVAL_RESULTS_FILE}"
          --suite "${AI_EVAL_SUITE_FILE}"
