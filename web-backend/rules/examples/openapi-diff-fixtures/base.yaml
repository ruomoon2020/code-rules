openapi: 3.0.3
info:
  title: Breaking gate smoke test
  version: 1.0.0
paths:
  /items/{id}:
    post:
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        '200':
          description: Item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
components:
  parameters:
    ItemId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    Item:
      type: object
      required: [name]
      properties:
        name:
          type: string
